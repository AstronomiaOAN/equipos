name: Pruebas

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas del backend (Apps Script simulado)
        run: node --test 'apps-script/pruebas/*.test.js'
      - name: Sintaxis de la web
        run: for f in web/js/*.js; do node --check "$f" || exit 1; done
  etiquetas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install reportlab
      - name: Generar etiquetas de ejemplo
        run: python herramientas/generar_etiquetas.py datos/equipos_ejemplo.csv --salida etiquetas.pdf
